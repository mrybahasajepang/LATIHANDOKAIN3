<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOKKAI KADAI HARIAN N3</title>
<style>
:root{
  --navy:#1c2b40;
  --navy-deep:#121e30;
  --cream:#faf5ea;
  --cream-deep:#f2e9d8;
  --card:#fffdf9;
  --border:#e7dcc4;
  --text:#2b2b2b;
  --sub:#6b6456;
  --gold:#c9a866;
  --gold-deep:#b3934f;
  --good:#3f7a5c;
  --good-bg:#eaf5ee;
  --bad:#bc4a3c;
  --bad-bg:#fbeae7;
  --shadow:0 2px 8px rgba(28,43,64,.06), 0 8px 24px rgba(28,43,64,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Hiragino Sans","Noto Sans JP","Zen Kaku Gothic New",sans-serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 70px}

/* ===== Header ===== */
.app-header{
  background:linear-gradient(135deg,var(--navy) 0%, var(--navy-deep) 100%);
  border-radius:18px;
  padding:22px 24px;
  color:#f5efe0;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}
.app-header h1{
  margin:0 0 4px; font-size:1.35rem; font-weight:700; letter-spacing:.02em;
}
.app-header p{margin:0; font-size:.85rem; color:#c9d2de}

/* ===== Section titles ===== */
.section-title{font-size:1.15rem; font-weight:700; text-align:center; margin:6px 0 4px; color:var(--navy)}
.section-sub{font-size:.82rem; color:var(--sub); text-align:center; margin:0 0 18px; line-height:1.6}

/* ===== Cards (menu screen) ===== */
.menu-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
  display:flex; align-items:center; gap:14px;
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.menu-card:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(28,43,64,.12)}
.menu-card.disabled{opacity:.5; cursor:not-allowed}
.menu-card .icon{font-size:1.6rem; flex:0 0 auto; width:40px; text-align:center}
.menu-card .body{flex:1; min-width:0}
.menu-card .title{font-weight:700; font-size:1rem; margin-bottom:2px; color:var(--navy)}
.menu-card .desc{font-size:.78rem; color:var(--sub); margin-bottom:8px}
.menu-card .progress-track{height:6px; background:var(--cream-deep); border-radius:99px; overflow:hidden}
.menu-card .progress-fill{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-deep)); border-radius:99px; transition:width .3s ease}
.menu-card .count{font-size:.72rem; color:var(--sub); margin-top:4px}
.menu-card .arrow{font-size:1.2rem; color:var(--gold-deep); flex:0 0 auto}

.subhead{
  font-size:.85rem; font-weight:700; color:var(--navy);
  margin:22px 2px 10px; display:flex; align-items:center; gap:6px;
}

.grid-btns{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:8px}
.grid-btns button{
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:12px 4px; font-size:.85rem; font-weight:600; color:var(--navy);
  cursor:pointer; transition:all .12s ease;
}
.grid-btns button:hover:not(:disabled){border-color:var(--gold-deep); background:var(--cream-deep)}
.grid-btns button:disabled{opacity:.35; cursor:not-allowed}
.grid-btns button.cleared{background:var(--good-bg); border-color:var(--good); color:var(--good)}
.hint-text{font-size:.72rem; color:var(--sub); text-align:center; margin:6px 0 4px}

.pill-btns{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
.pill-btns button{
  background:var(--card); border:1px solid var(--border); border-radius:999px;
  padding:9px 16px; font-size:.82rem; font-weight:600; color:var(--navy);
  cursor:pointer; transition:all .12s ease;
}
.pill-btns button:hover:not(:disabled){border-color:var(--gold-deep); background:var(--cream-deep)}
.pill-btns button:disabled{opacity:.4; cursor:not-allowed}
.pill-btns button .cnt{font-weight:400; color:var(--sub); font-size:.74rem}

.back-link{
  display:inline-flex; align-items:center; gap:6px;
  font-size:.8rem; color:var(--navy); font-weight:600; cursor:pointer;
  margin-bottom:12px; background:none; border:none; padding:6px 0;
}

/* ===== Quiz card ===== */
.progress-wrap{position:sticky; top:0; z-index:10; background:linear-gradient(var(--cream) 82%, transparent); padding:8px 0 12px}
.progress-info{display:flex; justify-content:space-between; font-size:.75rem; color:var(--sub); margin-bottom:6px; padding:0 2px}
.progress-info b{color:var(--navy)}
.progress-track-top{height:6px; background:var(--cream-deep); border-radius:99px; overflow:hidden; border:1px solid var(--border)}
.progress-fill-top{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-deep)); border-radius:99px; transition:width .3s ease}

.qcard{
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:22px 20px; box-shadow:var(--shadow); margin-top:8px;
}
.qcard .catbadge{
  display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.03em;
  background:var(--navy); color:#f5efe0; padding:4px 12px; border-radius:99px; margin-bottom:12px;
}
.qnum-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:9px; background:var(--navy); color:#f5efe0;
  font-weight:700; font-size:.85rem; margin-right:10px; flex:0 0 auto;
}
.qstem-row{display:flex; align-items:flex-start; margin-bottom:14px}
.qstem{font-size:1rem; line-height:1.9}
.qstem u{text-decoration-color:var(--bad); text-decoration-thickness:2px; text-underline-offset:3px}

.passage-box{
  background:var(--cream-deep); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; margin:0 0 16px; max-height:320px; overflow-y:auto;
}
.passage-box .ptitle{font-size:.8rem; font-weight:700; color:var(--gold-deep); margin-bottom:8px}
.passage-box .ptext{font-size:.94rem; line-height:2; color:var(--text)}
.passage-box .ptext u{text-decoration-color:var(--bad); text-decoration-thickness:2px; text-underline-offset:3px}
.passage-box::-webkit-scrollbar{width:6px}
.passage-box::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px}

.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; align-items:flex-start; gap:12px; border:1.5px solid var(--border);
  border-radius:12px; padding:12px 14px; cursor:pointer; background:#fffefb;
  font-size:.94rem; line-height:1.6; transition:all .12s ease;
}
.opt:hover:not(.disabled){border-color:var(--gold-deep); background:var(--cream-deep)}
.opt .badge{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--sub);
  display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:var(--sub);
}
.opt.selected{border-color:var(--navy); background:#eef1f5}
.opt.selected .badge{background:var(--navy); border-color:var(--navy); color:#fff}
.opt.correct{border-color:var(--good); background:var(--good-bg)}
.opt.correct .badge{background:var(--good); border-color:var(--good); color:#fff}
.opt.incorrect{border-color:var(--bad); background:var(--bad-bg)}
.opt.incorrect .badge{background:var(--bad); border-color:var(--bad); color:#fff}
.opt.disabled{cursor:default}

.feedback{margin-top:16px; border-radius:12px; overflow:hidden; display:none}
.feedback.show{display:block}
.fb-head{padding:10px 16px; font-weight:700; font-size:.85rem}
.feedback.ok .fb-head{background:var(--good); color:#fff}
.feedback.ng .fb-head{background:var(--bad); color:#fff}
.fb-body{background:var(--card); border:1px solid var(--border); border-top:none; padding:14px 16px; font-size:.87rem; line-height:1.85}
.fb-correct-ans{background:var(--cream-deep); border-left:3px solid var(--good); padding:8px 12px; border-radius:0 8px 8px 0; margin-bottom:10px}
.orig-block{margin-top:14px; border-top:1px dashed var(--border); padding-top:12px}
.orig-block .lbl{font-size:.7rem; font-weight:700; letter-spacing:.04em; color:var(--gold-deep); text-transform:uppercase; margin:10px 0 4px}
.orig-block .jp{font-size:1rem; line-height:2.2}
.orig-block .id2{font-size:.83rem; color:var(--sub); line-height:1.75; white-space:pre-line}
.orig-block ol{margin:4px 0 0; padding-left:20px}
.orig-block ol li{font-size:.88rem; line-height:2; margin-bottom:4px}
.orig-block ol li.correct-li{color:var(--good); font-weight:700}
ruby rt{font-size:.6em; color:var(--sub)}

.navbar{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
.nbtn{flex:1; padding:13px; border-radius:12px; font-weight:700; font-size:.88rem; border:none; cursor:pointer; transition:all .12s ease}
.nbtn.prev{background:var(--cream-deep); color:var(--navy)}
.nbtn.prev:disabled{opacity:.35; cursor:not-allowed}
.nbtn.next{background:var(--navy); color:#f5efe0}
.nbtn.next:hover{background:var(--navy-deep)}

/* ===== Result ===== */
.result-card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:34px 26px; text-align:center; box-shadow:var(--shadow)}
.result-ring{width:140px; height:140px; margin:0 auto 16px; position:relative}
.result-ring svg{transform:rotate(-90deg)}
.result-ring .pct{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.result-ring .pct b{font-size:1.8rem}
.result-ring .pct span{font-size:.7rem; color:var(--sub); margin-top:2px}
.result-card h2{margin:0 0 4px; font-size:1.3rem; color:var(--navy)}
.result-card .comment{font-size:.85rem; color:var(--sub); margin-bottom:20px}
.result-actions{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.result-btn{padding:13px; border-radius:12px; font-weight:700; font-size:.9rem; border:none; cursor:pointer}
.result-btn.primary{background:var(--navy); color:#f5efe0}
.result-btn.secondary{background:var(--cream-deep); color:var(--navy); border:1px solid var(--border)}

.hidden{display:none !important}

@media(max-width:520px){
  .grid-btns{grid-template-columns:repeat(4,1fr)}
  .qcard{padding:18px 14px}
  .menu-card{padding:14px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <h1>📖 DOKKAI KADAI HARIAN N3</h1>
    <p>読解 課題＋集中トレーニング</p>
  </div>

  <!-- ===== MENU SCREEN ===== -->
  <div id="menuScreen">
    <div class="section-title">挑戦するセットを選んでください</div>
    <div class="section-sub">好きなセットをタップすればすぐに始まります。進捗は自動的に保存され、間違えた問題はあとでまとめて復習できます。</div>

    <div class="menu-card" onclick="startQuiz(getAllQuestions())">
      <div class="icon">📘</div>
      <div class="body">
        <div class="title">全課題に挑戦</div>
        <div class="desc" id="allDesc">課題1〜5 まとめて（16問）</div>
        <div class="progress-track"><div class="progress-fill" id="allProgressFill" style="width:0%"></div></div>
        <div class="count" id="allProgressText">0 / 16 問回答済み</div>
      </div>
      <div class="arrow">›</div>
    </div>

    <div class="menu-card" onclick="startQuiz(getAllQuestions(),'集中トレーニング（全カテゴリー）')">
      <div class="icon">🎯</div>
      <div class="body">
        <div class="title">集中トレーニングに挑戦</div>
        <div class="desc">全カテゴリーまとめて</div>
        <div class="progress-track"><div class="progress-fill" id="focusProgressFill" style="width:0%"></div></div>
        <div class="count" id="focusProgressText">0 / 16 問回答済み</div>
      </div>
      <div class="arrow">›</div>
    </div>

    <div class="menu-card" id="reviewCard" onclick="startReview()">
      <div class="icon">❌</div>
      <div class="body">
        <div class="title">間違えた問題を復習</div>
        <div class="desc" id="reviewDesc">これまでに間違えた問題だけをまとめて解く（0問）</div>
      </div>
      <div class="arrow">›</div>
    </div>

    <div class="subhead">📗 特定の課題を選ぶ</div>
    <div class="grid-btns" id="kadaiGrid"></div>
    <div class="hint-text" id="kadaiHint"></div>

    <div class="subhead">🎯 特定のカテゴリー（集中トレーニング）を選ぶ</div>
    <div class="pill-btns" id="categoryPills"></div>
  </div>

  <!-- ===== QUIZ SCREEN ===== -->
  <div id="quizScreen" class="hidden">
    <button class="back-link" onclick="goToMenu()">← セット選択に戻る</button>
    <div class="progress-wrap">
      <div class="progress-info"><span id="quizModeLabel">課題1</span><span id="progressText">1 / 3</span></div>
      <div class="progress-track-top"><div class="progress-fill-top" id="progressFillTop" style="width:0%"></div></div>
    </div>
    <div class="qcard" id="qcard"></div>
    <div class="navbar">
      <button class="nbtn prev" id="prevBtn" onclick="goPrev()">← 前へ</button>
      <button class="nbtn next" id="nextBtn" onclick="goNext()">次へ →</button>
    </div>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="resultScreen" class="hidden">
    <div class="result-card">
      <div class="result-ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#f2e9d8" stroke-width="11"/>
          <circle id="ringFg" cx="70" cy="70" r="60" fill="none" stroke="#c9a866" stroke-width="11" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377"/>
        </svg>
        <div class="pct"><b id="scorePct">0%</b><span id="scoreFrac">0 / 0</span></div>
      </div>
      <h2 id="resultTitle">お疲れ様でした</h2>
      <p class="comment" id="resultComment"></p>
      <div class="result-actions">
        <button class="result-btn primary" onclick="showReviewList()">📋 この回の解説をまとめて見る</button>
        <button class="result-btn secondary" onclick="goToMenu()">🏠 セット選択に戻る</button>
      </div>
      <div id="reviewListArea" style="text-align:left; margin-top:22px;"></div>
    </div>
  </div>

</div>
<script>
/* =========================================================
   DATA: KADAI (課題 harian) — tiap kadai berisi 1 kategori dokkai
   category: "tanbun" (短文読解) | "chubun" (中文読解) | "chobun" (長文読解) | "jouhou" (情報検索)
========================================================= */
const KADAI = 
[
  {
    "id": 1,
    "category": "chubun",
    "day": "課題1",
    "passageTitle": "A町の朝市（あさいち）",
    "passage": "A町は<ruby>景色<rt>けしき</rt></ruby>の美しい<ruby>海沿<rt>うみぞ</rt></ruby>いの町で、毎週日曜の朝に港で開かれる「<ruby>朝市<rt>あさいち</rt></ruby>」も人気がある。<ruby>朝市<rt>あさいち</rt></ruby>は、A町にある店が、魚や肉、野菜、パン、ケーキなどを売る<ruby>市場<rt>いちば</rt></ruby>で、近くの市や町からも客が<ruby>大勢<rt>おおぜい</rt></ruby>やってくる。<br><br><ruby>朝市<rt>あさいち</rt></ruby>を始めたのは、A町に昔からある店の主人たちである。約30年前、大きなスーパーマーケットができた。多くの人がスーパーを利用するようになってしまったため、店の主人たちは、自分たちの店の<ruby>商品<rt>しょうひん</rt></ruby>の良さをもっと知ってもらおうと、<ruby>朝市<rt>あさいち</rt></ruby>を始めたのだ。<br><br><ruby>朝市<rt>あさいち</rt></ruby>では、人気がある<ruby>商品<rt>しょうひん</rt></ruby>はすぐ<ruby>売<rt>う</rt></ruby>り<ruby>切<rt>き</rt></ruby>れてしまう。そんなに人気があるなら、たくさん<ruby>売<rt>う</rt></ruby>ればいいのだが、<u>それ</u>はしないそうだ。この<ruby>朝市<rt>あさいち</rt></ruby>の<ruby>目的<rt>もくてき</rt></ruby>は、<ruby>朝市<rt>あさいち</rt></ruby>でお金を<ruby>稼<rt>かせ</rt></ruby>ぐことではなく、まず<ruby>朝市<rt>あさいち</rt></ruby>で自分たちの店について知ってもらって、ふだんA町の店で買い物をする客を増やすことだからだ。そのため、<ruby>朝市<rt>あさいち</rt></ruby>に<ruby>商品<rt>しょうひん</rt></ruby>が出せる人は（　　）だけ、ということになっている。",
    "questions": [
      {
        "stem": "A町にある店の主人たちは、何のために朝市を始めたのか。",
        "opts": [
          "町の中に、安く買い物ができるところを増やすため",
          "町の中に、近くの市や町から来る客が楽しめる場所を作るため",
          "自分たちの町の景色の美しさをもっと宣伝するため",
          "自分たちの店の商品の良さをもっと知ってもらうため"
        ],
        "ans": 3,
        "exp": "Paragraf ke-2 menjelaskan: setelah supermarket besar dibangun dan banyak orang beralih belanja ke sana, para pemilik toko memulai pasar pagi agar orang lebih tahu kualitas barang toko mereka sendiri. Jawaban 4 sesuai persis.",
        "full": "<ruby>店<rt>みせ</rt></ruby>の<ruby>主人<rt>しゅじん</rt></ruby>たちは、何のために<ruby>朝市<rt>あさいち</rt></ruby>を始めたのか。",
        "ftr": "Kota A adalah kota tepi laut yang pemandangannya indah, dan \"pasar pagi\" yang diadakan di pelabuhan setiap Minggu pagi juga populer. Pasar pagi adalah pasar tempat toko-toko di Kota A menjual ikan, daging, sayuran, roti, kue, dll., dan banyak pengunjung datang bahkan dari kota/daerah sekitar.\n\nYang memulai pasar pagi adalah para pemilik toko lama di Kota A. Sekitar 30 tahun lalu, sebuah supermarket besar dibangun. Karena banyak orang jadi berbelanja di supermarket, para pemilik toko memulai pasar pagi agar orang-orang lebih mengenal kualitas barang dagangan toko mereka sendiri.\n\nDi pasar pagi, barang yang populer cepat habis terjual. Padahal kalau memang sepopuler itu, bukankah lebih baik dijual lebih banyak — tapi ternyata mereka sengaja TIDAK melakukan itu. Tujuan pasar pagi ini bukan untuk mencari uang di pasar pagi itu sendiri, melainkan agar orang mengenal toko mereka lewat pasar pagi, lalu jumlah pelanggan yang berbelanja di toko Kota A sehari-hari (di luar pasar pagi) bertambah. Karena itu, yang boleh menjual barang di pasar pagi hanyalah orang yang [___].",
        "oi": [
          "1. Untuk menambah tempat belanja murah di dalam kota. (salah, tidak disebutkan soal harga murah)",
          "2. Untuk membuat tempat yang bisa dinikmati pengunjung dari kota/daerah sekitar. (salah, ini efek sampingan bukan tujuan utama)",
          "3. Untuk lebih mempromosikan keindahan pemandangan kota mereka. (salah, bukan soal promosi pemandangan)",
          "4. <ruby>自分<rt>じぶん</rt></ruby>たちの<ruby>店<rt>みせ</rt></ruby>の<ruby>商品<rt>しょうひん</rt></ruby>の<ruby>良<rt>よ</rt></ruby>さをもっと<ruby>知<rt>し</rt></ruby>ってもらうため ＝ Agar orang lebih mengenal kualitas barang dagangan toko mereka sendiri. ✓ (jawaban benar)"
        ]
      },
      {
        "stem": "<u>それ</u>とあるが、何か。",
        "opts": [
          "朝市で人気がある商品を、店で売るより高く売ること",
          "朝市で人気がある商品を、朝市でもっと売ること",
          "朝市でしか買えない商品の種類を増やすこと",
          "朝市でしか買えない商品を平日に店でも売ること"
        ],
        "ans": 1,

const CATEGORY_LABEL = {
  tanbun: "短文読解",
  chubun: "中文読解",
  chobun: "長文読解",
  jouhou: "情報検索"
};
const CATEGORY_ICON = {
  tanbun: "📄", chubun: "📝", chobun: "📚", jouhou: "🔍"
};

/* ===== Flatten into a master question list with global sequential numbering ===== */
const MASTER = [];
KADAI.forEach(k=>{
  if(k.multi_passage){
    k.questions.forEach((q,idx)=>{
      MASTER.push({
        gnum: 0, // assigned below
        kadaiId: k.id, kadaiDay: k.day, category: k.category,
        passageTitle: q.passageTitle || k.passageTitle,
        passage: q.passage,
        stem: q.stem, opts: q.opts, ans: q.ans, exp: q.exp,
        full: q.full, ftr: q.ftr, oi: q.oi
      });
    });
  } else {
    k.questions.forEach((q)=>{
      MASTER.push({
        gnum: 0,
        kadaiId: k.id, kadaiDay: k.day, category: k.category,
        passageTitle: k.passageTitle,
        passage: k.passage,
        stem: q.stem, opts: q.opts, ans: q.ans, exp: q.exp,
        full: q.full, ftr: q.ftr, oi: q.oi
      });
    });
  }
});
MASTER.forEach((q,i)=>{ q.gnum = i+1; });
const TOTAL_ALL = MASTER.length;

/* ===== Progress persistence (per global question number) ===== */
const STORAGE_KEY = 'dokkai_kadai_harian_n3_progress';
let PROGRESS = {}; // { gnum: true/false }
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) PROGRESS = JSON.parse(raw);
  }catch(e){ PROGRESS = {}; }
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(PROGRESS)); }catch(e){}
}
loadProgress();

function getAllQuestions(){ return MASTER.slice(); }
function getQuestionsByKadai(id){ return MASTER.filter(q=>q.kadaiId===id); }
function getQuestionsByCategory(cat){ return MASTER.filter(q=>q.category===cat); }
function getWrongQuestions(){ return MASTER.filter(q=> PROGRESS[q.gnum]===false); }

function countAnswered(list){ return list.filter(q=>PROGRESS[q.gnum]!==undefined).length; }
function countCorrect(list){ return list.filter(q=>PROGRESS[q.gnum]===true).length; }

/* ===== Build menu screen ===== */
function renderMenu(){
  const all = getAllQuestions();
  const answeredAll = countAnswered(all);
  document.getElementById('allDesc').textContent = `課題1〜${KADAI.length} まとめて（${TOTAL_ALL}問）`;
  document.getElementById('allProgressFill').style.width = (answeredAll/TOTAL_ALL*100)+'%';
  document.getElementById('allProgressText').textContent = `${answeredAll} / ${TOTAL_ALL} 問回答済み`;
  document.getElementById('focusProgressFill').style.width = (answeredAll/TOTAL_ALL*100)+'%';
  document.getElementById('focusProgressText').textContent = `${answeredAll} / ${TOTAL_ALL} 問回答済み`;

  const wrong = getWrongQuestions();
  const reviewCard = document.getElementById('reviewCard');
  document.getElementById('reviewDesc').textContent = `これまでに間違えた問題だけをまとめて解く（${wrong.length}問）`;
  if(wrong.length===0){ reviewCard.classList.add('disabled'); } else { reviewCard.classList.remove('disabled'); }

  // Kadai grid
  const grid = document.getElementById('kadaiGrid');
  grid.innerHTML = '';
  KADAI.forEach(k=>{
    const qs = getQuestionsByKadai(k.id);
    const correct = countCorrect(qs);
    const done = countAnswered(qs)===qs.length && qs.length>0;
    const b = document.createElement('button');
    b.textContent = k.id;
    b.title = k.day + ' ('+CATEGORY_LABEL[k.category]+')';
    if(done) b.classList.add('cleared');
    b.onclick = ()=> startQuiz(qs, k.day+'（'+CATEGORY_LABEL[k.category]+'）');
    grid.appendChild(b);
  });
  document.getElementById('kadaiHint').textContent = `現在、課題1〜${KADAI.length}まで利用可能です（今後も追加予定）`;

  // Category pills
  const pillWrap = document.getElementById('categoryPills');
  pillWrap.innerHTML = '';
  ['tanbun','chubun','chobun','jouhou'].forEach(cat=>{
    const qs = getQuestionsByCategory(cat);
    const b = document.createElement('button');
    b.innerHTML = `${CATEGORY_ICON[cat]} ${CATEGORY_LABEL[cat]} <span class="cnt">(${qs.length}問)</span>`;
    if(qs.length===0){
      b.disabled = true;
      b.innerHTML = `${CATEGORY_ICON[cat]} ${CATEGORY_LABEL[cat]} <span class="cnt">(準備中)</span>`;
    } else {
      b.onclick = ()=> startQuiz(qs, CATEGORY_LABEL[cat]+'（集中トレーニング）');
    }
    pillWrap.appendChild(b);
  });
}

/* ===== Quiz state ===== */
let currentList = [];
let currentIdx = 0;
let currentLabel = '';
let currentAnswers = {}; // idx in currentList -> selected option idx

function startQuiz(list, label){
  if(!list || list.length===0) return;
  currentList = list;
  currentIdx = 0;
  currentLabel = label || (list[0].kadaiDay || '');
  currentAnswers = {};
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  renderQuestion();
}
function startReview(){
  const wrong = getWrongQuestions();
  if(wrong.length===0) return;
  startQuiz(wrong, '間違えた問題の復習');
}
function goToMenu(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('menuScreen').classList.remove('hidden');
  renderMenu();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuestion(){
  const q = currentList[currentIdx];
  document.getElementById('quizModeLabel').textContent = currentLabel;
  document.getElementById('progressText').textContent = `${currentIdx+1} / ${currentList.length}`;
  document.getElementById('progressFillTop').style.width = ((currentIdx+1)/currentList.length*100)+'%';

  const catLabel = CATEGORY_LABEL[q.category] || '';
  let html = `<div class="catbadge">${catLabel} ・ ${q.kadaiDay}</div>`;

  if(q.passage){
    html += `<div class="passage-box">`;
    if(q.passageTitle) html += `<div class="ptitle">📖 ${q.passageTitle}</div>`;
    html += `<div class="ptext">${q.passage}</div></div>`;
  }

  html += `<div class="qstem-row"><div class="qnum-badge">${q.gnum}</div><div class="qstem">${q.stem}</div></div>`;

  html += `<div class="opts" id="optsWrap">`;
  q.opts.forEach((opt,i)=>{
    html += `<div class="opt" data-idx="${i}" onclick="pickOption(${i})"><div class="badge">${i+1}</div><div>${opt}</div></div>`;
  });
  html += `</div><div class="feedback" id="feedback"></div>`;

  document.getElementById('qcard').innerHTML = html;

  if(currentAnswers[currentIdx]!==undefined){
    lockOptions(currentAnswers[currentIdx]);
    showFeedback(currentAnswers[currentIdx]);
  }

  document.getElementById('prevBtn').disabled = (currentIdx===0);
  const allDone = currentList.every((_,i)=>currentAnswers[i]!==undefined);
  document.getElementById('nextBtn').textContent = (currentIdx===currentList.length-1) ? '結果を見る ✓' : '次へ →';
}

function pickOption(i){
  if(currentAnswers[currentIdx]!==undefined) return;
  currentAnswers[currentIdx] = i;
  const q = currentList[currentIdx];
  PROGRESS[q.gnum] = (i===q.ans);
  saveProgress();
  lockOptions(i);
  showFeedback(i);
}

function lockOptions(selectedIdx){
  const q = currentList[currentIdx];
  document.querySelectorAll('#optsWrap .opt').forEach(el=>{
    const idx = parseInt(el.dataset.idx);
    el.classList.add('disabled');
    if(idx===q.ans) el.classList.add('correct');
    else if(idx===selectedIdx) el.classList.add('incorrect');
    if(idx===selectedIdx) el.classList.add('selected');
  });
}

function showFeedback(selectedIdx){
  const q = currentList[currentIdx];
  const isCorrect = selectedIdx===q.ans;
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect?'ok':'ng');
  let html = `<div class="fb-head">${isCorrect?'✓ 正解！':'✗ 不正解'}</div><div class="fb-body">`;
  html += `<div class="fb-correct-ans">📌 正解：${q.ans+1}. ${q.opts[q.ans]}</div>`;
  html += `<div>${q.exp}</div>`;
  html += `<div class="orig-block">`;
  if(q.full){ html += `<div class="lbl">📝 設問（ルビ付き）</div><div class="jp">${q.full}</div>`; }
  if(q.ftr){ html += `<div class="lbl">🇮🇩 Terjemahan Bacaan</div><div class="id2">${q.ftr}</div>`; }
  if(q.oi && q.oi.length){
    html += `<div class="lbl">📋 Semua Pilihan (ruby + arti)</div><ol>`;
    q.oi.forEach((item,i)=>{ html += `<li class="${i===q.ans?'correct-li':''}">${item}</li>`; });
    html += `</ol>`;
  }
  html += `</div></div>`;
  fb.innerHTML = html;
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function goNext(){
  const allDone = currentList.every((_,i)=>currentAnswers[i]!==undefined);
  if(currentIdx===currentList.length-1 && allDone){ showResult(); return; }
  if(currentIdx < currentList.length-1){ currentIdx++; renderQuestion(); }
  else {
    const nextUnanswered = currentList.findIndex((_,i)=>currentAnswers[i]===undefined);
    if(nextUnanswered!==-1){ currentIdx = nextUnanswered; renderQuestion(); }
    else showResult();
  }
}
function goPrev(){
  if(currentIdx===0) return;
  currentIdx--; renderQuestion();
}

function showResult(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  const total = currentList.length;
  const correct = currentList.reduce((acc,q,i)=> acc + (currentAnswers[i]===q.ans?1:0), 0);
  const pct = Math.round(correct/total*100);
  document.getElementById('scorePct').textContent = pct+'%';
  document.getElementById('scoreFrac').textContent = `${correct} / ${total}`;
  const circumference = 2*Math.PI*60;
  const offset = circumference - (pct/100)*circumference;
  const ring = document.getElementById('ringFg');
  ring.setAttribute('stroke-dasharray', circumference);
  ring.style.transition='stroke-dashoffset 1s ease';
  setTimeout(()=>ring.setAttribute('stroke-dashoffset', offset), 100);

  let title, comment;
  if(pct>=80){ title='素晴らしい出来です！'; comment='この調子でどんどん次の課題に進みましょう。'; }
  else if(pct>=60){ title='もう少しで完璧！'; comment='間違えた問題の解説をチェックしておきましょう。'; }
  else { title='復習していきましょう'; comment='焦らず、解説を読みながら少しずつ力をつけていきましょう。'; }
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultComment').textContent = comment;
  document.getElementById('reviewListArea').innerHTML = '';
  window.scrollTo({top:0,behavior:'smooth'});
}

function showReviewList(){
  const area = document.getElementById('reviewListArea');
  let html = '';
  currentList.forEach((q,i)=>{
    const sel = currentAnswers[i];
    const isCorrect = sel===q.ans;
    html += `<div style="border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px;">
      <div style="font-size:.9rem; margin-bottom:6px;"><b>問${q.gnum}.</b> ${q.stem.replace(/<[^>]+>/g,'')}</div>
      <div style="font-size:.78rem; color:${isCorrect?'var(--good)':'var(--bad)'};">${isCorrect?'✓':'✗'} あなたの答え: ${sel!==undefined?(sel+1)+'. '+q.opts[sel].replace(/<[^>]+>/g,''):'(未回答)'} ｜ 正解: ${q.ans+1}. ${q.opts[q.ans].replace(/<[^>]+>/g,'')}</div>
      <div style="font-size:.78rem; color:var(--sub); margin-top:4px;">${q.exp}</div>
    </div>`;
  });
  area.innerHTML = html;
  area.scrollIntoView({behavior:'smooth'});
}

/* INIT */
renderMenu();
</script>
